// ============================================================
//  RENDER ENGINE
// ============================================================
(function () {
  var D = PAGE_DATA;

  // --- Hero ---
  document.getElementById('hero-title').textContent = D.pageTitle || '—';
  document.getElementById('hero-breadcrumb-current').textContent = (D.pageTitle || 'Article').substring(0, 40);
  document.getElementById('hero-date').textContent = D.lastUpdated || '—';

  if (D.categoryChip) {
    var chip = document.getElementById('hero-chip');
    chip.textContent = D.categoryChip;
    chip.style.display = '';
  }

  if (D.heroDescription) {
    var desc = document.getElementById('hero-desc');
    desc.textContent = D.heroDescription;
    desc.style.display = '';
  }

  if (D.heroImageUrl) {
    var hr = document.getElementById('hero-right');
    hr.style.display = '';
    document.getElementById('hero-img').src = D.heroImageUrl;
  }

  // --- TOC ---
  var toc = document.getElementById('toc');
  var tocList = document.getElementById('toc-list');
  if (D.tocItems && D.tocItems.length) {
    // Only show TOC items whose corresponding section exists in articleBlocks
    var blockIds = {};
    (D.articleBlocks || []).forEach(function (b) {
      if (b.id) blockIds[b.id] = true;
    });

    var shown = D.tocItems.filter(function (item) {
      return blockIds[item.id];
    });

    if (shown.length) {
      toc.style.display = '';
      shown.forEach(function (item) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#' + item.id;
        a.textContent = item.label;
        li.appendChild(a);
        tocList.appendChild(li);
      });
    }
  }

  // --- Build content + banners map ---
  var content = document.getElementById('article-content');

  // Build a map: afterSectionId -> banner object
  var bannerMap = {};
  (D.bannersInArticle || []).forEach(function (b) {
    if (b.afterSectionId) bannerMap[b.afterSectionId] = b;
  });

  function renderBlock(block) {
    var el, wrap, table, img, ph;

    switch (block.type) {
      case 'h2':
        el = document.createElement('h2');
        el.id = block.id || '';
        el.textContent = block.text || '—';
        return el;

      case 'h3':
        el = document.createElement('h3');
        el.textContent = block.text || '—';
        return el;

      case 'p':
        el = document.createElement('p');
        // Allow basic HTML in text (links, bold, etc.)
        if (block.text) el.innerHTML = block.text;
        else el.textContent = '—';
        return el;

      case 'ul':
        el = document.createElement('ul');
        (block.listItems || []).forEach(function (item) {
          var li = document.createElement('li');
          li.textContent = item || '—';
          el.appendChild(li);
        });
        return el;

      case 'ol':
        el = document.createElement('ol');
        (block.listItems || []).forEach(function (item) {
          var li = document.createElement('li');
          li.innerHTML = item || '—';
          el.appendChild(li);
        });
        return el;

      case 'table':
        if (!block.table || !block.table.headers) return null;
        wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        table = document.createElement('table');
        // thead
        var thead = document.createElement('thead');
        var headRow = document.createElement('tr');
        block.table.headers.forEach(function (h) {
          var th = document.createElement('th');
          th.textContent = h || '';
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);
        // tbody
        var tbody = document.createElement('tbody');
        (block.table.rows || []).forEach(function (row) {
          var tr = document.createElement('tr');
          row.forEach(function (cell) {
            var td = document.createElement('td');
            td.textContent = cell || '';
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        wrap.appendChild(table);
        return wrap;

      case 'hr':
        el = document.createElement('hr');
        return el;

      case 'callout':
        el = document.createElement('div');
        el.className = 'callout';
        el.innerHTML = block.text || '';
        return el;

      case 'quote':
        el = document.createElement('blockquote');
        el.textContent = block.text || '—';
        return el;

      case 'cards_intro':
        el = document.createElement('p');
        el.style.cssText = 'font-size:.88rem;color:#64748b;margin-bottom:8px;font-style:italic;';
        el.textContent = block.text || '';
        return el;

      default:
        // Unknown type → fallback paragraph
        el = document.createElement('p');
        el.textContent = block.text || '—';
        return el;
    }
  }

  function renderBanner(banner) {
    if (!banner || !banner.imageUrl) return null;
    var wrap = document.createElement('div');
    wrap.className = 'article-banner';
    wrap.dataset.bannerId = banner.id || '';
    img = document.createElement('img');
    img.src = banner.imageUrl;
    img.alt = banner.alt || '';
    img.onerror = function () {
      this.style.display = 'none';
      if (this.nextElementSibling) this.nextElementSibling.style.display = 'flex';
    };
    wrap.appendChild(img);
    ph = document.createElement('div');
    ph.className = 'banner-placeholder';
    ph.style.display = 'none';
    ph.textContent = '🖼';
    wrap.appendChild(ph);
    return wrap;
  }

  // Render article blocks and insert banners after their target sections
  (D.articleBlocks || []).forEach(function (block) {
    var rendered = renderBlock(block);
    if (rendered) content.appendChild(rendered);

    // Insert banner after the section that matches afterSectionId
    if (block.id && bannerMap[block.id]) {
      var bannerEl = renderBanner(bannerMap[block.id]);
      if (bannerEl) content.appendChild(bannerEl);
    }
  });

  // --- Product Cards ---
  if (D.productsGrid && D.productsGrid.length) {
    var prodSection = document.getElementById('products-section');
    var prodGrid = document.getElementById('products-grid');
    prodSection.style.display = '';

    D.productsGrid.forEach(function (p) {
      var card = document.createElement('a');
      card.className = 'card';
      card.href = p.aliExpressUrl || '#';
      card.target = '_blank';
      card.rel = 'noopener noreferrer';

      // Image
      var imgWrap = document.createElement('div');
      imgWrap.className = 'card-img-wrap';
      if (p.imageUrl) {
        var cimg = document.createElement('img');
        cimg.src = p.imageUrl;
        cimg.alt = p.name || '';
        cimg.onerror = function () {
          this.style.display = 'none';
          if (this.nextElementSibling) this.nextElementSibling.style.display = 'flex';
        };
        imgWrap.appendChild(cimg);
      }
      var cph = document.createElement('div');
      cph.className = 'card-img-placeholder';
      cph.style.display = p.imageUrl ? 'none' : 'flex';
      cph.textContent = '📦';
      imgWrap.appendChild(cph);
      card.appendChild(imgWrap);

      // Body
      var body = document.createElement('div');
      body.className = 'card-body';

      var name = document.createElement('h3');
      name.className = 'card-name truncate-2';
      name.textContent = p.name || '—';
      body.appendChild(name);

      if (p.priceText) {
        var price = document.createElement('span');
        price.className = 'card-price';
        price.textContent = p.priceText;
        body.appendChild(price);
      }

      var rating = document.createElement('div');
      rating.className = 'card-rating';
      rating.innerHTML = '<span class="stars">★★★★★</span><span>(1234 reviews)</span>';
      body.appendChild(rating);

      var link = document.createElement('span');
      link.className = 'card-link';
      link.textContent = 'View on AliExpress →';
      body.appendChild(link);

      card.appendChild(body);
      prodGrid.appendChild(card);
    });
  }

  // Update page title
  document.title = D.pageTitle || 'Article';

})();
</script>
